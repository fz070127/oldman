services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_HOST}:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_HOST}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_HOST}:9000:9000"
      - "${INFRA_BIND_HOST}:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  emqx:
    image: emqx:5
    hostname: emqx
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_HOST}:1883:1883"
      - "${INFRA_BIND_HOST}:18083:18083"
    environment:
      EMQX_NODE_NAME: emqx@emqx
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD:?Set EMQX_DASHBOARD__DEFAULT_PASSWORD in deploy/.env}
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build: ../backend
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_HOST}:8000:${APP_PORT}"
    environment:
      - APP_ENV
      - APP_PORT
      - DATABASE_URL
      - REDIS_URL
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      - DEMO_SEED_PASSWORD
      - JWT_ALG
      - ACCESS_TOKEN_EXPIRE_MIN
      - REFRESH_TOKEN_EXPIRE_DAY
      - MINIO_ENDPOINT
      - MINIO_AK
      - MINIO_SK
      - MINIO_BUCKET
      - MQTT_HOST
      - MQTT_PORT
      - MQTT_USER
      - MQTT_PASS
      - NOTIFY_PROVIDER
      - ESCALATE_TIME_SCALE
      - ESCALATE_POLL_INTERVAL_SEC
      - CORS_ORIGINS
      - POSE_ONNX_PATH=/srv/models/onnx/yolov8n-pose.onnx
      - STGCN_ONNX_PATH=/srv/models/onnx/stgcn_static.onnx
    volumes:
      - ../algo/data/processed/onnx:/srv/models/onnx:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      emqx:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5

  h5:
    profiles: ["h5"]
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: h5
    restart: unless-stopped
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  minio_data:
  emqx_data:
