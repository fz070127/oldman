[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-bell-backend"
version = "1.0.0"
description = "银铃守护后端服务"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg",
    "alembic",
    "redis>=5,<8",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "PyYAML>=6,<7",
    "structlog",
    "python-jose[cryptography]",
    "bcrypt",
    "minio",
    "aiomqtt>=2,<3",
    "pytest",
    "pytest-asyncio",
    "httpx>=0.27,<0.29",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.data-files]
"share/silver-bell" = ["config/escalate.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
